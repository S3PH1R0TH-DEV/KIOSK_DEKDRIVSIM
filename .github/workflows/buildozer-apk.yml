name: Build APK Buildozer (APK serveur signe) - manual only

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: ${{ runner.os }}-buildozer-v3-clean-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-v3-clean-

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Error: KEYSTORE_BASE64 is empty"
            exit 1
          fi
          printf "%s" "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > release.keystore
          echo "=== Keystore Info ==="
          ls -l release.keystore
          file release.keystore

      - name: Clean stale buildozer app+dist (conflit dek-drivsim-pc precedent)
        run: |
          rm -rf .buildozer/android/app 2>/dev/null || true
          rm -rf .buildozer/android/platform/build-*/dists 2>/dev/null || true
          rm -rf .buildozer/android/platform/build-*/build/venv 2>/dev/null || true
          rm -rf ~/.buildozer/android/platform/build-*/build/venv 2>/dev/null || true
          echo "stale app/dist/venv nettoyes"

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Buildozer deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openjdk-17-jdk unzip zip libncurses5-dev libffi-dev libssl-dev autoconf automake libtool libtool-bin libltdl-dev pkg-config zlib1g-dev liblzo2-dev cmake ninja-build
          python -m pip install --upgrade pip==23.3.1 setuptools==68 wheel==0.43.0
          pip install buildozer==1.5.0 cython==0.29.36
          # Patch p4a si deja installe (evite pip -U pip -> 26 / BuildDependencyInstallError)
          PYFORA=$(python -c "import pythonforandroid; print(pythonforandroid.__file__)" 2>/dev/null || echo "")
          if [ -n "$PYFORA" ]; then echo "p4a at $PYFORA"; sed -i 's/pip install -U pip/pip install pip==23.3.1/g' $(dirname $PYFORA)/build.py 2>/dev/null || true; fi

      - name: Patch p4a clone (pip + template cleartext)
        run: |
          # 1. Buildozer clone p4a dans .buildozer pendant le build (pas site-packages) :
          #    le clone persiste via le cache, on le patch avant de builder.
          for f in .buildozer/android/platform/python-for-android/pythonforandroid/build.py; do
            if [ -f "$f" ]; then
              echo "Patch pip $f"
              sed -i 's/pip install -U pip/pip install pip==23.3.1/g' "$f"
              grep -n "pip==23.3.1" "$f" | head -3
            else
              echo "p4a clone absent (premier build), sera patche au retry"
            fi
          done
          # 2. Contournement bug buildozer 1.5.0 extra_manifest_application_arguments
          #    (guillemets litteraux injectes -> MergeFailureException) : on ecrit
          #    usesCleartextTraffic directement dans le template p4a.
          T=$(find .buildozer/android/platform/python-for-android -path "*_sdl_common/build/templates/AndroidManifest.tmpl.xml" 2>/dev/null | head -1)
          if [ -n "$T" ]; then
            if grep -q "usesCleartextTraffic" "$T"; then
              echo "Template deja patche : $T"
            else
              sed -i 's|<application android:label="@string/app_name"|& android:usesCleartextTraffic="true"|' "$T"
              echo "Template patche : $T"
            fi
            grep -n "usesCleartextTraffic" "$T"
          else
            echo "Template p4a absent (premier build), sera patche au retry"
          fi

      - name: Build APK Release signe
        run: |
          set +e
          buildozer android release
          RET=$?
          if [ $RET -ne 0 ]; then
            echo "=== 1er buildozer echoue ($RET), patch p4a + regen dist + retry ==="
            find .buildozer -path "*python-for-android*" -name "build.py" -exec sed -i 's/pip install -U pip/pip install pip==23.3.1/g' {} \; 2>/dev/null || true
            T=$(find .buildozer/android/platform/python-for-android -path "*_sdl_common/build/templates/AndroidManifest.tmpl.xml" 2>/dev/null | head -1)
            if [ -n "$T" ] && ! grep -q "usesCleartextTraffic" "$T"; then
              sed -i 's|<application android:label="@string/app_name"|& android:usesCleartextTraffic="true"|' "$T"
              echo "Template patche au retry : $T"
            fi
            rm -rf .buildozer/android/platform/build-*/build/venv 2>/dev/null || true
            rm -rf .buildozer/android/platform/build-*/dists 2>/dev/null || true
            rm -rf .buildozer/android/app 2>/dev/null || true
            buildozer android release
            RET=$?
          fi
          if [ $RET -ne 0 ]; then
            echo "=== DIAGNOSTIC ==="
            find .buildozer -name "AndroidManifest.xml" -path "*dists*" -exec echo "--- {} ---" \; -exec cat {} \; 2>/dev/null | head -n 120 || true
          fi
          exit $RET
        env:
          # Chemin ABSOLU obligatoire : le template Gradle p4a fait
          # storeFile file(System.getenv(...)) resolu depuis dists/***/,
          # un relatif pointait vers dists/***/release.keystore (introuvable).
          P4A_RELEASE_KEYSTORE: ${{ github.workspace }}/release.keystore
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.KEYSTORE_PASSWORD }}
          P4A_RELEASE_KEYALIAS: ${{ secrets.KEY_ALIAS }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.KEY_PASSWORD }}

      - name: Verify APK signature (echoue si unsigned)
        run: |
          APK=$(ls bin/*.apk | head -1)
          echo "APK: $APK"
          ls -lh "$APK"
          APKSIGNER=$(find ~/.buildozer /opt/hostedtoolcache -name apksigner 2>/dev/null | head -1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK"
          else
            jarsigner -verify -verbose -certs "$APK" | head -20
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dek-drivsim-release
          path: bin/*.apk

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-logs
          path: .buildozer/logs/

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build (Buildozer)
          body: |
            **Build automatique DEK-DRIVSIM** — ${{ github.sha }}
            APK Release signe via Buildozer.
          files: bin/*.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
