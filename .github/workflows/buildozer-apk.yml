name: Build APK Buildozer (APK serveur signe) - manual only

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: ${{ runner.os }}-buildozer-v2-pip23-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-v2-pip23-

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Error: KEYSTORE_BASE64 is empty"
            exit 1
          fi
          printf "%s" "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > release.keystore
          echo "=== Keystore Info ==="
          ls -l release.keystore
          file release.keystore

      - name: Fix pip venv corrompu
        run: |
          rm -rf .buildozer/android/platform/build-*/build/venv 2>/dev/null || true
          rm -rf ~/.buildozer/android/platform/build-*/build/venv 2>/dev/null || true
          echo "venv nettoye"

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Buildozer deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openjdk-17-jdk unzip zip libncurses5-dev libffi-dev libssl-dev autoconf automake libtool libtool-bin libltdl-dev pkg-config zlib1g-dev liblzo2-dev cmake ninja-build
          python -m pip install --upgrade pip==23.3.1 setuptools==68 wheel==0.43.0
          pip install buildozer==1.5.0 cython==0.29.36
          # Patch p4a si deja installe (evite pip -U pip -> 26)
          PYFORA=$(python -c "import pythonforandroid; print(pythonforandroid.__file__)" 2>/dev/null || echo "")
          if [ -n "$PYFORA" ]; then echo "p4a at $PYFORA"; sed -i 's/pip install -U pip/pip install pip==23.3.1/g' $(dirname $PYFORA)/build.py 2>/dev/null || true; fi

      - name: Build APK Release signe
        run: |
          # Patch p4a venv pip upgrade qui casse pip 26/python3.14 BuildDependencyInstallError
          # On wrap le buildozer pour patcher a la volee entre 2 essais
          set +e
          buildozer android release
          RET=$?
          if [ $RET -ne 0 ]; then
            echo "Premier buildozer echoue ($RET), patch p4a pip -U pip -> pip==23.3.1 et retry"
            find .buildozer -type f -name "*.py" -exec sed -i 's/pip install -U pip/pip install pip==23.3.1/g' {} \; 2>/dev/null || true
            find $HOME/.buildozer -type f -name "*.py" -exec sed -i 's/pip install -U pip/pip install pip==23.3.1/g' {} \; 2>/dev/null || true
            # purge venv corrompu et relance
            rm -rf .buildozer/android/platform/build-*/build/venv 2>/dev/null || true
            rm -rf $HOME/.buildozer/android/platform/build-*/build/venv 2>/dev/null || true
            buildozer android release
            RET=$?
          fi
          exit $RET
        env:
          P4A_RELEASE_KEYSTORE: release.keystore
          P4A_RELEASE_KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          P4A_RELEASE_KEYALIAS: ${{ secrets.KEY_ALIAS }}
          P4A_RELEASE_KEYALIAS_PASS: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dek-drivsim-release
          path: bin/*.apk

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-logs
          path: .buildozer/logs/

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build (Buildozer)
          body: |
            **Build automatique DEK-DRIVSIM** — ${{ github.sha }}
            APK Release signe via Buildozer.
          files: bin/*.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
